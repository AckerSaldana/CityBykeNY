# Configuración de Streamlit para este proyecto. Solo lo indispensable.
# Este archivo vive en app/.streamlit, junto a Inicio.py. Ahí Streamlit lo lee
# sin importar desde qué carpeta se abra la app. No lo muevas a la raíz del
# proyecto: ahí solo se leería al abrir la app desde la raíz.

[browser]
# No enviar estadísticas de uso a Streamlit.
gatherUsageStats = false

[server]
# No pedir un correo en la terminal la primera vez que se abre la app.
showEmailPrompt = false
# Para la demostración: no vigilar los archivos de código. Así nunca aparece el
# aviso "Source file changed" (ni "File change") arriba de la página.
# Las tablas de datos no dependen de esto: al reconstruirlas, la app toma las
# nuevas en la siguiente interacción o al recargar la página.
# Si cambias el código de app/, hay que detener y volver a abrir la app
# (o poner aquí "auto" mientras desarrollas).
fileWatcherType = "none"
runOnSave = false

[client]
# Para la demostración: sin el botón "Deploy" ni el menú de desarrollo arriba a la derecha.
toolbarMode = "viewer"
