# =============================================================================
#  REGLAS DE OPERACIÓN DEL REBALANCEO
# =============================================================================
#
#  Confirmadas por logística el 2026-10-10. Cada valor tiene su respuesta y su
#  justificación en docs/reglas_operacion.md, que también dice qué parte es
#  dato con fuente, qué parte es cálculo propio y qué parte es supuesto.
#
#  El simulador lee TODO de este archivo, igual que los datos de muestra: no
#  hay números de operación escritos en el código. Cambiar un valor aquí
#  cambia el resultado de la simulación. Si se cambia, se anota en el registro
#  de cambios del documento.
#
#  Después de editar, comprueba que el archivo sigue siendo válido con:
#      pytest tests/test_operacion_config.py
#
#  Los decimales van con punto (0.5), nunca con coma (0,5).
# =============================================================================

estado: confirmado                       # provisional | confirmado
confirmado_por: Rodrigo Gutiérrez        # nombre de quien confirma
fecha_confirmacion: "2026-10-10"         # AAAA-MM-DD

# -----------------------------------------------------------------------------
# Pregunta 1. Franjas horarias de rebalanceo y momento de intervención
# -----------------------------------------------------------------------------
# Dos rondas de camiones al día. La nocturna deja las estaciones listas a las
# 05:00 para la mañana; la de mediodía trabaja después del pico de la mañana y
# las deja listas a las 14:00 para la tarde. El riesgo se cuenta las 24 horas
# y se reporta en tres renglones: manana, tarde y fuera de franja (22 a 06).
# Horas en formato "HH:MM", hora local de Nueva York.
# Reglas: momento_intervencion <= inicio < fin, y las franjas no se enciman.
#
# parte_del_presupuesto: qué parte del presupuesto del día le toca a la franja.
#   La ronda nocturna lleva el 60 %: de noche no hay tráfico y además tiene que
#   deshacer el desbalance del día anterior. Lo que una franja no usa pasa a la
#   siguiente franja del MISMO día; lo que sobra al terminar el día se pierde.
#   Cada una debe ser mayor que 0 y entre todas deben sumar 1.
franjas:
  - nombre: manana
    momento_intervencion: "05:00"
    inicio: "06:00"
    fin: "14:00"
    parte_del_presupuesto: 0.6
  - nombre: tarde
    momento_intervencion: "14:00"
    inicio: "14:00"
    fin: "22:00"
    parte_del_presupuesto: 0.4

# -----------------------------------------------------------------------------
# Pregunta 2. Umbral de riesgo
# -----------------------------------------------------------------------------
# Una estación está "en riesgo" en una hora si le quedan MENOS bicis que
# bicis_minimas (riesgo de vaciarse) o MENOS lugares libres que
# lugares_libres_minimos (riesgo de llenarse).
# En riesgo con 0 o 1 bicis, o con 0, 1 o 2 lugares libres. El lado lleno
# lleva un lugar más de margen: las bicis descompuestas ocupan anclajes que el
# simulador no ve, y no poder devolver es peor que no poder sacar.
# Reglas: enteros, de 1 en adelante.
umbral_riesgo:
  bicis_minimas: 2
  lugares_libres_minimos: 3

# Estaciones con valet (opcional; el validador revisa días, ids y horas). En
# estas horas no cuentan como riesgo ni reciben presupuesto, porque el valet
# recibe bicis fuera de los anclajes. Días sin acento: lunes, martes,
# miercoles, jueves, viernes, sabado, domingo.
# Los station_id van entre comillas: son texto y los ceros finales importan.
# Días de North Moore St por confirmar (se suponen de lunes a viernes).
excepciones_valet:
  dias: [lunes, martes, miercoles, jueves, viernes]
  estaciones:
    "6492.08": [["07:00", "11:00"], ["16:00", "20:00"]]   # 9 Ave & W 33 St
    "6584.12": [["07:00", "11:00"], ["16:00", "20:00"]]   # E 47 St & Park Ave
    "4804.02": [["07:00", "11:00"], ["16:00", "20:00"]]   # Dock 72 Way & Market St
    "6822.09": [["07:00", "11:00"], ["16:00", "20:00"]]   # 1 Ave & E 68 St
    "5288.08": [["07:00", "11:00"], ["16:00", "20:00"]]   # Park Pl & Church St
    "5470.12": [["06:00", "10:00"], ["16:00", "20:00"]]   # North Moore St & Greenwich St

# -----------------------------------------------------------------------------
# Pregunta 3. Presupuestos para la curva, en bicis por estación por día
# -----------------------------------------------------------------------------
# presupuestos_por_estacion: bicis movidas por estación por día. El simulador
#   multiplica cada valor por las estaciones que simula y redondea. Con las
#   2,315 estaciones de la corrida del 10 de octubre de 2026:
#     0     ->     0  sin intervención
#     0.35  ->   810  mitad del austero
#     0.7   -> 1,620  austero: nivel de 2024 y de invierno
#     1.4   -> 3,241  realista: lo que Citi Bike reporta mover hoy por estación
#     2.6   -> 6,019  ambicioso: el volumen de julio de 2019
#     4.3   -> 9,954  techo de referencia: lo que se acumula en una franja hábil
#   Reglas: de menor a mayor, sin repetir y con punto decimal.
presupuestos_por_estacion: [0, 0.35, 0.7, 1.4, 2.6, 4.3]

# presupuesto_de_referencia: el de las recomendaciones del dashboard. Es el
#   realista: 1.4 con 2,315 estaciones son 3,241 bicis movidas al día.
presupuesto_de_referencia: 1.4

# -----------------------------------------------------------------------------
# Pregunta 4. Distancia máxima entre la estación que dona y la que recibe
# -----------------------------------------------------------------------------
# En kilómetros, en línea recta. Un traslado entre dos estaciones más lejanas
# que esto no se permite. Corta a propósito: la línea recta no sabe de ríos ni
# de puentes, y una distancia corta reduce ese problema (no lo quita; se
# declara como limitación).
distancia_maxima_km: 2.0

# Grupos aislados (opcional; el validador revisa que una estación esté en un
# solo grupo): estaciones que solo intercambian bicis entre ellas. Governors Island no
# tiene puente y queda a ~1 km de Manhattan y Brooklyn en línea recta.
grupos_aislados:
  governors_island: ["4631.02", "4440.02", "4374.01"]   # Soissons Landing, Yankee Ferry Terminal, Picnic Point

# -----------------------------------------------------------------------------
# Pregunta 5. Estrategia por tipo de estación
# -----------------------------------------------------------------------------
# prioridad: a quién se atiende primero cuando el presupuesto no alcanza
#   (3 = alta, 2 = media, 1 = baja).
# ocupacion_respaldo: fracción de la capacidad (0.0 = vacía, 1.0 = llena).
#   1. Inventario inicial común de las tres políticas: el primer día arranca
#      con el valor de la primera franja (manana) y no cuenta (calentamiento).
#      Después cada día empieza con las bicis que dejó el anterior.
#   2. Valor que se usa cuando ningún inventario inicial evita a la vez que la
#      estación se vacíe y se llene. Por eso casi en los extremos: si la ola no
#      cabe, se deja el mayor espacio posible del lado que se va a desbordar.
#   La regla histórica y el modelo lo usan igual: la única diferencia entre
#   ellas es el pronóstico.
#   Mejora pedida a programación: acotar el respaldo entre bicis_minimas y
#   capacidad − lugares_libres_minimos. Sin la cota, 0.90 deja 2 lugares libres
#   en una estación de 23 anclajes; aun así, en las estación-día sin solución
#   deja menos horas en riesgo que 0.80.
#   Debe haber un valor por cada franja definida arriba.
estrategia_por_tipo:
  oficinas:
    prioridad: 3
    ocupacion_respaldo:
      manana: 0.10               # la ola de llegadas no cabe: casi vacía
      tarde: 0.90                # la ola de salidas no cabe: casi llena
  residencial:
    prioridad: 3
    ocupacion_respaldo:
      manana: 0.90               # la ola de salidas no cabe: casi llena
      tarde: 0.15                # la ola de regresos no cabe: casi vacía
  recreativa:
    prioridad: 1
    ocupacion_respaldo:
      manana: 0.50
      tarde: 0.50
  mixta:
    prioridad: 2
    ocupacion_respaldo:
      manana: 0.50
      tarde: 0.50
