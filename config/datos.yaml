# =============================================================================
#  PERIODO DE DATOS, TRAMOS DE VALIDACIÓN, REGLAS DE LIMPIEZA Y SIMULACIÓN
# =============================================================================
#  Lo ajusta programación. Lo leen la limpieza (scripts/build_tables.py), los
#  modelos y el simulador, con src.data.datos_config.load_datos().
#
#  Si cambias algo aquí hay que volver a correr, en este orden:
#      python scripts/build_tables.py
#      python scripts/run_baseline.py
#  y después la simulación. Si solo cambias el bloque `simulacion` (al final),
#  basta con volver a correr la simulación.
#
#  Fechas en formato AAAA-MM-DD, hora local de Nueva York. El día de "fin"
#  está incluido.
# =============================================================================

# Meses de viajes que se leen de data/raw/trips (se bajan con
# scripts/download_trips.py).
meses_crudos: [202607, 202608, 202609]

# Periodo de análisis.
# Termina el 29 de septiembre y no el 30 a propósito: los archivos traen los
# viajes que TERMINAN en cada mes, y el de octubre todavía no existe. Los
# viajes que salieron el 30 por la noche y terminaron el 1 de octubre faltan
# (cerca de 1 de cada 6 salidas de las 23:00, estimado con los miércoles
# anteriores). Hasta el 29 las salidas y las llegadas están completas.
periodo:
  inicio: 2026-07-01
  fin: 2026-09-29

# Tres tramos ordenados en el tiempo, sin huecos ni traslapes (decisión 4).
# Las decisiones se toman con validación. La prueba final se usa una sola vez.
tramos:
  entrenamiento: {inicio: 2026-07-01, fin: 2026-08-31}
  validacion:    {inicio: 2026-09-01, fin: 2026-09-14}
  prueba:        {inicio: 2026-09-15, fin: 2026-09-29}

# Unión de variantes de un mismo id de estación (decisión 15).
# Dos escrituras como 2231.1 y 2231.10, o 5308.04 y 5308.04_, se unen solo si
# tienen el mismo nombre y sus coordenadas están a esta distancia o menos.
# Con 1 metro se exige, en la práctica, la misma coordenada.
union_de_ids:
  distancia_maxima_m: 1.0

# Estaciones que no entran a las tablas. Un viaje que sale de una estación
# normal hacia una de estas sigue contando como salida; solo no hay llegada.
estaciones_excluidas:
  # HB y JC: Nueva Jersey. Aquí solo aparecen como destino; sus salidas están
  #   en otros archivos (JC-...), así que su flujo quedaría incompleto.
  # SYS: talleres y bodegas, no son estaciones públicas.
  prefijos: [HB, JC, SYS]
  # Talleres con id de otra forma ("Morgan HCT Charging" y "Shop Morgan").
  ids: ["1234.56", "Shop Morgan"]

# Ajustes de la simulación de inventario. Solo los lee el simulador.
# Aquí va lo que NO es una regla de operación. Las reglas (franjas, umbrales,
# presupuestos, distancia) están en config/operacion.yaml.
simulacion:
  # Días de calentamiento. La simulación empieza el primer día del tramo de
  # validación con un inventario supuesto (ocupacion_respaldo, en
  # operacion.yaml). Estos primeros días se simulan igual que los demás, pero
  # NO cuentan en las métricas: sirven para que las estaciones dejen de estar
  # todas igual de llenas, como en el arranque.
  # OJO: el calentamiento NO quita la dependencia de ese supuesto.
  # ocupacion_respaldo fija con cuántas bicis arranca la red. Los traslados no
  # agregan ni quitan bicis, y un viaje solo cambia el total cuando entra o
  # sale del conjunto simulado. Por eso el nivel de riesgo simulado y el
  # riesgo simulado evitado cambian con ese valor, también en el último día.
  # Entero, mayor o igual a 0 y menor que los días del tramo de validación
  # (tiene que quedar al menos un día que sí cuente).
  dias_de_calentamiento: 1

  # Intervalo de la curva de políticas. Sale de remuestrear DÍAS COMPLETOS:
  # se sortean, con repetición, los días que sí cuentan, se vuelve a sumar el
  # riesgo, y eso se repite `remuestreos` veces (mínimo 100).
  # OJO: los días NO son independientes. El inventario con que termina un día
  # es el punto de partida del siguiente, y los días seguidos se parecen. Por
  # eso el intervalo es INDICATIVO: puede salir más angosto de lo debido. No
  # es una garantía estadística.
  remuestreos: 2000

  # Nivel del intervalo, mayor que 0.5 y menor que 1. 0.90 es un intervalo
  # del 90 %.
  nivel_del_intervalo: 0.90

  # Semilla del sorteo: con la misma semilla sale el mismo intervalo.
  semilla: 20260901
